<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title><?= brandName ?> — Giriş Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#f8fafc;--card-bg:rgba(255,255,255,0.75);--primary:#6366f1;--primary-light:rgba(var(--primary-rgb),0.08);--success:#10b981;--success-light:rgba(16,185,129,0.08);--danger:#ef4444;--danger-light:rgba(239,68,68,0.08);--warning:#f59e0b;--warning-light:rgba(245,158,11,0.08);--text-main:#0f172a;--text-muted:#64748b;--border:rgba(255,255,255,0.6);--card-shadow:0 30px 60px -15px rgba(15,23,42,0.08),0 0 0 1px rgba(15,23,42,0.04);}
  *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  body{background:var(--bg);color:var(--text-main);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow:hidden;position:relative;}
  .glow-1{position:fixed;top:-15%;left:-10%;width:60vw;height:60vw;background:#e0e7ff;border-radius:50%;filter:blur(120px);opacity:0.7;z-index:0;}
  .glow-2{position:fixed;bottom:-15%;right:-10%;width:60vw;height:60vw;background:#fae8ff;border-radius:50%;filter:blur(120px);opacity:0.6;z-index:0;}
  .terminal{background:var(--card-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--border);padding:3rem 2.5rem;border-radius:36px;box-shadow:var(--card-shadow);width:100%;max-width:400px;text-align:center;position:relative;z-index:1;}
  .brand-logo{font-size:1.15rem;font-weight:800;color:var(--text-main);letter-spacing:4px;margin-bottom:2.5rem;display:flex;justify-content:center;align-items:center;gap:10px;text-transform:uppercase;}
  .brand-logo i{color:#854d0e;}
  /* Device screens */
  .loader-screen{text-align:center;padding:2rem 0;}
  .loader-screen i{color:var(--primary);}
  .loader-screen p{margin-top:1rem;color:var(--text-muted);font-size:0.9rem;font-weight:500;}
  .pending-screen{display:none;}
  .status-icon{width:72px;height:72px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:1.5rem;}
  .status-icon.warning{background:var(--warning-light);color:var(--warning);border:1px solid rgba(245,158,11,0.15);}
  .status-icon.danger{background:var(--danger-light);color:var(--danger);border:1px solid rgba(239,68,68,0.15);}
  .status-title{font-size:1.25rem;font-weight:700;margin-bottom:0.75rem;letter-spacing:-0.3px;}
  .status-desc{font-size:0.87rem;color:var(--text-muted);line-height:1.6;font-weight:500;}
  .device-id-box{margin-top:1.5rem;background:rgba(15,23,42,0.03);border:1px solid rgba(15,23,42,0.06);border-radius:14px;padding:1rem 1.2rem;text-align:left;}
  .device-id-lbl{font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:6px;}
  .device-id-val{font-family:monospace;font-size:0.9rem;font-weight:600;color:var(--text-main);word-break:break-all;}
  .btn-check{margin-top:1.5rem;width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:16px;font-size:0.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(var(--primary-rgb),0.2);transition:all 0.2s;}
  .btn-check:hover{background:#4f46e5;}
  .scan-area{display:none;}
  .qr-display-area{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .qr-box{background:#fff;padding:12px;border-radius:20px;box-shadow:0 6px 24px rgba(15,23,42,0.1);line-height:0;}
  .qr-label{font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);}
  .qr-timer-bar{width:280px;height:4px;background:rgba(15,23,42,0.07);border-radius:10px;overflow:hidden;margin-top:2px;}
  .qr-timer-fill{height:100%;background:var(--primary);border-radius:10px;transition:width 1s linear;}
  .qr-hint-text{font-size:0.8rem;color:var(--text-muted);font-weight:600;}

/* Ehtiyat defoltlar — brend rəngi yoxdursa panelin öz rəngi qalır */
:root{--primary-rgb:99,102,241;--primary-dark:#4d50bc;--primary-light:rgba(99,102,241,0.08);}

/* Brend rəngi — müştərinin öz rəngi (tenants.brand.themeColor). Sonda durur ki, yuxarıdakı defoltları üstələsin. */
:root{<?= brandCss ?>}
</style>
</head>
<body>
<div class="glow-1"></div><div class="glow-2"></div>
<div class="terminal">
  <div class="brand-logo"><i class="<?= brandIcon ?>"></i> <?= brandName ?></div>
  <div class="loader-screen" id="loaderScreen">
    <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
    <p>Cihaz yoxlanılır...</p>
  </div>
  <div class="pending-screen" id="pendingScreen">
    <div class="status-icon warning" id="statusIcon"><i class="fa-solid fa-hourglass-half"></i></div>
    <div class="status-title" id="statusTitle">Admin Təsdiqi Gözlənilir</div>
    <div class="status-desc" id="statusDesc">Bu cihaz admin tərəfindən hələ təsdiqlənməyib.</div>
    <div class="device-id-box"><div class="device-id-lbl"><i class="fa-solid fa-microchip"></i> Cihaz ID</div><div class="device-id-val" id="deviceIdVal">—</div></div>
    <button class="btn-check" onclick="checkDevice()"><i class="fa-solid fa-rotate"></i> Yenidən Yoxla</button>
  </div>
  <div class="scan-area" id="scanArea">
    <!-- Kiosk yalnız QR göstərir — serverə heç nə yazmır. -->
    <div class="qr-display-area" id="qrDisplayArea">
      <div class="qr-label"><i class="fa-solid fa-qrcode"></i> İşçi Kartı ilə Skan Et</div>
      <div class="qr-box">
        <div id="qrPasspage"></div>
      </div>
      <div class="qr-timer-bar"><div class="qr-timer-fill" id="qrTimerFill"></div></div>
      <div class="qr-hint-text" id="qrHintText"><i class="fa-solid fa-mobile-screen-button"></i> Şəxsi kartınızı açıb kameranı yönəldin</div>
    </div>
  </div>
</div>
<script src="/gsr-shim.js"></script>
<script>
var myDeviceId=localStorage.getItem('scan_device_id_v1');
if(!myDeviceId){myDeviceId='SCN-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).substring(2,6).toUpperCase();localStorage.setItem('scan_device_id_v1',myDeviceId);}
document.getElementById('deviceIdVal').innerText=myDeviceId;

// Kioskun "açarı" cihaz ID-sidir — gsr-shim bunu X-CM-Key kimi göndərir və
// server həm cihazı, həm də hansı müştəriyə aid olduğunu tanıyır.
var DEVICE_KEY = myDeviceId;
// Cihaz hələ qeydə alınmayıbsa hansı müştəri olduğu yalnız linkdəki ?t= ilə
// bilinir. Bir dəfə saxlanılır ki, sonrakı açılışlarda link olmasa da işləsin.
var TENANT_HINT = <?= tenantHint_js ?> || localStorage.getItem('scan_tenant_v1') || '';
if (TENANT_HINT) localStorage.setItem('scan_tenant_v1', TENANT_HINT);

function checkDevice(){
  document.getElementById('loaderScreen').style.display='block';
  document.getElementById('pendingScreen').style.display='none';
  document.getElementById('scanArea').style.display='none';
  google.script.run
    .withSuccessHandler(function(res){
      document.getElementById('loaderScreen').style.display='none';
      if(res&&res.allowed){document.getElementById('scanArea').style.display='block';initPasspageQr();}
      else{
        var ip=res&&res.pending;
        var icon=document.getElementById('statusIcon');
        icon.className='status-icon '+(ip?'warning':'danger');
        icon.innerHTML=ip?"<i class='fa-solid fa-hourglass-half'></i>":"<i class='fa-solid fa-ban'></i>";
        document.getElementById('statusTitle').innerText=ip?'Admin Təsdiqi Gözlənilir':'Giriş Qadağandır';
        document.getElementById('statusDesc').innerText=res?res.reason:'Bu cihaza giriş icazəsi verilməyib.';
        document.getElementById('pendingScreen').style.display='block';
      }
    })
    .withFailureHandler(function(){
      document.getElementById('loaderScreen').style.display='none';
      document.getElementById('statusIcon').className='status-icon danger';
      document.getElementById('statusIcon').innerHTML="<i class='fa-solid fa-triangle-exclamation'></i>";
      document.getElementById('statusTitle').innerText='Sistem Xətası';
      document.getElementById('statusDesc').innerText='Serverə qoşulmaq mümkün olmadı.';
      document.getElementById('pendingScreen').style.display='block';
    })
    .checkScanDevice(myDeviceId);
}
checkDevice();
setInterval(function(){if(document.getElementById('pendingScreen').style.display==='block')checkDevice();},30000);

// ══════════════════════════════════════════════════════════════════
//  QEYD: PIN REJİMİ SİLİNDİ (2026-08-22)
// ══════════════════════════════════════════════════════════════════
//  Burada rəqəm klaviaturası, `validateAndLog` çağırışı və nəticə/xəbərdarlıq
//  ekranları vardı. Rejim heç vaxt istifadə edilmədi və üstəlik zəif nöqtə idi:
//  işçi öz PIN ekranının şəklini filialdakı həmkarına göndərib özü gəlmədən
//  qeyd oluna bilərdi (WiFi yoxlaması bunu tutmurdu, çünki sorğunu kiosk edir).
//
//  Kiosk ARTIQ SERVERƏ HEÇ NƏ YAZMIR — yalnız QR göstərir. Gəlişi işçinin öz
//  telefonu qeyd edir; server isə QR tokenini (bu cihaz, bu vaxt pəncərəsi) və
//  filial WiFi-ını yoxlayır.

// ══════════════════════════════════════════════════════════════════
//  QR GÖSTƏRMƏ SİSTEMİ (passpage terminalı)
// ══════════════════════════════════════════════════════════════════
var _ppQr = null, _ppQrTw = 0, _ppQrInterval = null;
var QR_STEP = 30000; // 30 saniyədə bir yenilənir

function initPasspageQr() {
  var tw = Math.floor(Date.now() / QR_STEP);
  _ppQrTw = tw;
  var content = 'CMQR:' + myDeviceId + ':' + tw;
  _ppQr = new QRCode(document.getElementById('qrPasspage'), {
    text: content, width: 256, height: 256,
    colorDark: '#0f172a', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  updateQrTimer();
  _ppQrInterval = setInterval(tickQr, 1000);
}

function tickQr() {
  var tw = Math.floor(Date.now() / QR_STEP);
  if (tw !== _ppQrTw) {
    _ppQrTw = tw;
    _ppQr.makeCode('CMQR:' + myDeviceId + ':' + tw);
  }
  updateQrTimer();
}

function updateQrTimer() {
  var msLeft = QR_STEP - (Date.now() % QR_STEP);
  var pct = (msLeft / QR_STEP) * 100;
  var fill = document.getElementById('qrTimerFill');
  if (fill) fill.style.width = pct + '%';
}

</script>
<footer style="text-align:center;padding:18px 0 14px;font-family:Inter,sans-serif;"><div style="font-size:0.72rem;font-weight:600;color:rgba(15,23,42,0.3);letter-spacing:0.01em;">created by <?= brandFooter ?></div><div style="font-size:0.65rem;color:rgba(15,23,42,0.2);margin-top:2px;">version 1.0.1</div></footer>
